# =============================================================================
# Kaggle Playground Series S6E3 — Customer Churn Prediction
# =============================================================================
# Binary classification: predict Churn (0/1)
# Metric: AUC-ROC
# Data: ~594k train, ~254k test, 19 features
# Signal: strong (tenure corr=-0.42, MonthlyCharges corr=+0.27)
# Class balance: 22.5% positive — well balanced
# Features: tenure, MonthlyCharges, TotalCharges (continuous)
#           + 6 binary + 10 low-cardinality categoricals
#
# Round 4 — FINAL RUN — 14h budget (after round_report_ps-s6e3_20260319_191655.txt)
# DB state: CatBoost 162 trials (0.9162), XGBoost 236 (0.9134), LightGBM 47 DROPPED
#           TabM 38 main (0.9149), RealMLP 115 main (0.9147)  [run_name permanent]
#
# Key findings from round_report:
#   CatBoost: ALL 8 HPs locked, landscape_roughness=0.000007, no gain trials 113-162 → 20min
#   XGBoost:  constraint removal +0.002 confirmed, ALL HPs LOW (flat space) → 1.5h
#   LightGBM: SATURATED + 0/10 arrays in R3 ensemble → DROPPED
#   RealMLP:  best at #115 (last!), gain_rate=0.77, fix act=selu+p_drop_sched=flat_cos
#   TabM:     best at #39 (last!), fix n_blocks=2, add min_quality_percentile=25
#
# 14h budget allocation (sequential):
# - RealMLP  5h:  substudy 1h → main 4h  (fix 2 converged categoricals)
# - TabM     6h:  substudy 1h → main 5h  (fix n_blocks=2, quality gate)
# - XGBoost  1.5h: constraint-free, flat space — diversity source
# - CatBoost 20min: token budget only — at ceiling
# Total: 5 + 6 + 1.5 + 0.33 = 12.83h
# =============================================================================

run_name: "ps-s6e3"                             # permanent — Optuna DBs grow across runs

data:
  train_path: "competitions/ps-s6e3/train.csv"
  test_path: "competitions/ps-s6e3/test.csv"
  target_column: "Churn"
  id_column: "id"
  task_type: "binary_classification"

extra_data:
  - path: "competitions/ps-s6e3/WA_Fn-UseC_-Telco-Customer-Churn.csv"
    target_column: "Churn"          # Yes/No string — same format as train, auto-mapped
    column_mapping:
      customerID: id                # rename ID col to match pipeline id_column
    sample_weight: 5.0              # 7k real rows vs 594k synthetic — upweight for signal
    # Notes:
    # - TotalCharges is str in original (11 empty rows → NaN) — auto-coerced by _concat_extra_data
    # - All 19 feature columns match train exactly (no drop_columns needed)

cv:
  n_folds: 10
  seed: 42
  stratified: true

strategy:
  mode: "manual"
  api:
    provider: "anthropic"
    model: "claude-sonnet-4-6"
    env_key: "ANTHROPIC_API_KEY"
    max_tokens: 4096
  manual:
    eda_output_path: "competitions/ps-s6e3/results/eda_report.txt"
    strategy_input_path: "competitions/ps-s6e3/strategy_output.yaml"

models:
  - realmlp
  - tabm
  - catboost
  - xgboost
  # lightgbm: DROPPED — saturated (gain_rate=0.00), excluded from R3 ensemble (0/10 arrays)

features:
  interactions: []
  ratios: []
  target_encoding:
    columns: []
    pairs: []
    alpha: 15
  custom: []

ensemble:
  strategy: "nsga2"
  nsga2_trials: 10000
  diversity_weight: 0.3
  diversity_metric: "spearman_neff"      # AUC-based metric → Spearman neff
  meta_models: ["logreg", "xgboost"]
  meta_cv_folds: 15
  meta_trials:
    logreg: 50                           # Reduced vs Porto — avoid meta overfit
    xgboost: 50                          # Reduced vs Porto — avoid meta overfit

optuna:
  global_seed: 42
  global_timeout: null
  storage_dir: "competitions/ps-s6e3/results/optuna"   # SQLite per model; load_if_exists=True
  persist_trackers: true                               # save OOF predictions → interrupt-safe
  reset_trackers: true                                 # R4: extra_data changed train size → start OOF fresh
  model_timeouts:
    realmlp: "4h"                        # main study after substudy; substudy has own 1h timeout
    tabm: "5h"                           # main study after substudy; 5h = ~25 new trials (only 38 total so far)
    catboost: "20min"                    # TOKEN BUDGET — ceiling reached, ALL HPs locked, no gain since trial#112
    xgboost: "1h30min"                   # constraint removal +0.002 confirmed; flat space, 1.5h for diversity

runtime:
  gpu_check: true
  gpu_fallback: true
  n_jobs: -1
  verbose: 2

output:
  submission_path: "competitions/ps-s6e3/results/submission.csv"
  results_dir: "competitions/ps-s6e3/results/"
  save_oof: true
  lb_score: 0.91345             # R3 LB score — enables Section 11 (OOF-LB gap) in round report
