# =============================================================================
# Kaggle Playground Series S6E3 — Customer Churn Prediction
# =============================================================================
# Binary classification: predict Churn (0/1)
# Metric: AUC-ROC
# Data: ~594k train, ~254k test, 19 features
# Signal: strong (tenure corr=-0.42, MonthlyCharges corr=+0.27)
# Class balance: 22.5% positive — well balanced
# Features: tenure, MonthlyCharges, TotalCharges (continuous)
#           + 6 binary + 10 low-cardinality categoricals
#
# Round 2 — 15h budget (FTT removed: too slow, ~45min/trial on full data)
# R1 results: RealMLP 0.9153, TabM 0.9145, FTT 0.9138 (only 3 trials)
# R1 issues: TabM fold_timeout=120s too tight (47% pruned), CatBoost crashed
#
# 15h budget allocation (sequential):
# - RealMLP  2h:  substudy 1h (full data, 2-fold, QMC) → main 2h pure TPE
# - TabM     3h:  substudy 1h (full data, 2-fold, QMC) → main 3h pure TPE
# - CatBoost 3h:  GPU, QMC=15
# - XGBoost  3h:  GPU, QMC=15
# - LightGBM 3h:  GPU, QMC=15
# Substudies run first (sequential), not counted in model_timeouts below.
# Total worst-case: (1+2) + (1+3) + 3+3+3 = 16h. In practice GBMs finish
# before their timeout due to early stopping → expect ~14-15h.
# =============================================================================

run_name: "ps-s6e3-r2"                         # study names: ps-s6e3-r2__realmlp etc.

data:
  train_path: "competitions/ps-s6e3/train.csv"
  test_path: "competitions/ps-s6e3/test.csv"
  target_column: "Churn"
  id_column: "id"
  task_type: "binary_classification"

cv:
  n_folds: 10
  seed: 42
  stratified: true

strategy:
  mode: "manual"
  api:
    provider: "anthropic"
    model: "claude-sonnet-4-6"
    env_key: "ANTHROPIC_API_KEY"
    max_tokens: 4096
  manual:
    eda_output_path: "competitions/ps-s6e3/results/eda_report.txt"
    strategy_input_path: "competitions/ps-s6e3/strategy_output.yaml"

models:
  - realmlp
  - tabm
  - catboost
  - xgboost
  - lightgbm

features:
  interactions: []
  ratios: []
  target_encoding:
    columns: []
    pairs: []
    alpha: 15
  custom: []

ensemble:
  strategy: "nsga2"
  nsga2_trials: 10000
  diversity_weight: 0.3
  diversity_metric: "spearman_neff"      # AUC-based metric → Spearman neff
  meta_models: ["logreg", "xgboost"]
  meta_cv_folds: 15
  meta_trials:
    logreg: 50                           # Reduced vs Porto — avoid meta overfit
    xgboost: 50                          # Reduced vs Porto — avoid meta overfit

optuna:
  global_seed: 42
  global_timeout: null
  storage_dir: "competitions/ps-s6e3/results/optuna"   # SQLite per model
  persist_trackers: true                               # save OOF predictions → interrupt-safe
  model_timeouts:
    realmlp: "2h"                        # main study after substudy; substudy has own 1h timeout
    tabm: "3h"                           # main study after substudy; substudy has own 1h timeout
    catboost: "3h"                       # GPU, full exploration (crashed in R1)
    xgboost: "3h"                        # GPU, full exploration
    lightgbm: "3h"                       # GPU, full exploration

runtime:
  gpu_check: true
  gpu_fallback: true
  n_jobs: -1
  verbose: 2

output:
  submission_path: "competitions/ps-s6e3/results/submission.csv"
  results_dir: "competitions/ps-s6e3/results/"
  save_oof: true
