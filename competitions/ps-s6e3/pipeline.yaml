# =============================================================================
# Kaggle Playground Series S6E3 — Customer Churn Prediction
# =============================================================================
# Binary classification: predict Churn (0/1)
# Metric: AUC-ROC
# Data: ~594k train, ~254k test, 19 features
# Signal: strong (tenure corr=-0.42, MonthlyCharges corr=+0.27)
# Class balance: 22.5% positive — well balanced
# Features: tenure, MonthlyCharges, TotalCharges (continuous)
#           + 6 binary + 10 low-cardinality categoricals
#
# 16h budget allocation:
# - RealMLP 5h30m: 1h substudy (full data, 2-fold QMC) + 4h30m main TPE (fold_coverage)
# - TabM    5h30m: 1h substudy (full data, 2-fold QMC) + 4h30m main TPE (fold_coverage)
# - FTT     3h:    30m substudy (10%, 2-fold QMC) + 2.5h main TPE (fold_coverage, fold_timeout=600s)
# - CatBoost 40m: GPU, symmetric trees
# - XGBoost  40m: GPU, level-wise
# - LightGBM 40m: CPU, leaf-wise
# =============================================================================

run_name: "ps-s6e3-r1"                         # study names: ps-s6e3-r1__realmlp etc.

data:
  train_path: "competitions/ps-s6e3/train.csv"
  test_path: "competitions/ps-s6e3/test.csv"
  target_column: "Churn"
  id_column: "id"
  task_type: "binary_classification"

cv:
  n_folds: 10
  seed: 42
  stratified: true

strategy:
  mode: "manual"
  api:
    provider: "anthropic"
    model: "claude-sonnet-4-6"
    env_key: "ANTHROPIC_API_KEY"
    max_tokens: 4096
  manual:
    eda_output_path: "competitions/ps-s6e3/results/eda_report.txt"
    strategy_input_path: "competitions/ps-s6e3/strategy_output.yaml"

models:
  - realmlp
  - tabm
  - ftt
  - catboost
  - xgboost
  - lightgbm

features:
  interactions: []
  ratios: []
  target_encoding:
    columns: []
    pairs: []
    alpha: 15
  custom: []

ensemble:
  strategy: "nsga2"
  nsga2_trials: 10000
  diversity_weight: 0.3
  diversity_metric: "spearman_neff"      # AUC-based metric → Spearman neff
  meta_models: ["logreg", "xgboost"]
  meta_cv_folds: 15
  meta_trials:
    logreg: 50                           # Reduced vs Porto — avoid meta overfit
    xgboost: 50                          # Reduced vs Porto — avoid meta overfit

optuna:
  global_seed: 42
  global_timeout: null
  storage_dir: "competitions/ps-s6e3/results/optuna"   # SQLite per model
  model_timeouts:
    realmlp: "5h30m"                     # 1h substudy + ~4h30m main TPE
    tabm: "5h30m"                        # 1h substudy + ~4h30m main TPE
    ftt: "3h"                            # 30m substudy + ~2.5h main TPE, fold_coverage
    catboost: "40m"                      # GPU, fast convergence
    xgboost: "40m"                       # GPU, fast convergence
    lightgbm: "40m"                      # GPU (if gpu build), leaf-wise fast

runtime:
  gpu_check: true
  gpu_fallback: true
  n_jobs: -1
  verbose: 2

output:
  submission_path: "competitions/ps-s6e3/results/submission.csv"
  results_dir: "competitions/ps-s6e3/results/"
  save_oof: true
